<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>claude is gay 🌈</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pacifico&family=Nunito:wght@400;700;900&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --red:    #FF4B4B;
      --orange: #FF9F1C;
      --yellow: #FFEE32;
      --green:  #52D053;
      --blue:   #4B9FFF;
      --purple: #B86BFF;
      --pink:   #FF6EB4;
    }

    html, body {
      height: 100%;
      font-family: 'Nunito', sans-serif;
      overflow: hidden;
    }

    /* ── rainbow stripe background ── */
    body {
      background: linear-gradient(
        180deg,
        var(--red)    0%   16.6%,
        var(--orange) 16.6% 33.2%,
        var(--yellow) 33.2% 49.8%,
        var(--green)  49.8% 66.4%,
        var(--blue)   66.4% 83%,
        var(--purple) 83%  100%
      );
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* ── floating sparkles ── */
    .sparkles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .sparkle {
      position: absolute;
      border-radius: 50%;
      opacity: 0;
      animation: float linear infinite;
    }

    @keyframes float {
      0%   { transform: translateY(110vh) rotate(0deg);   opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { transform: translateY(-10vh) rotate(720deg); opacity: 0; }
    }

    /* ── card ── */
    .card {
      position: relative;
      z-index: 1;
      background: rgba(255,255,255,0.18);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 3px solid rgba(255,255,255,0.55);
      border-radius: 2.5rem;
      padding: 3rem 3.5rem;
      text-align: center;
      box-shadow: 0 8px 48px rgba(0,0,0,0.18);
      max-width: 600px;
      width: 90%;
      animation: pop 0.7s cubic-bezier(0.34,1.56,0.64,1) both;
    }

    @keyframes pop {
      from { transform: scale(0.5); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }

    .headline {
      font-family: 'Pacifico', cursive;
      font-size: clamp(2.8rem, 8vw, 5.5rem);
      line-height: 1.1;
      color: #fff;
      text-shadow:
        3px 3px 0 rgba(0,0,0,0.15),
        0 0 40px rgba(255,255,255,0.5);
      animation: wobble 3s ease-in-out infinite;
    }

    @keyframes wobble {
      0%, 100% { transform: rotate(-2deg); }
      50%       { transform: rotate(2deg);  }
    }

    .rainbow-text {
      background: linear-gradient(
        90deg,
        var(--red), var(--orange), var(--yellow),
        var(--green), var(--blue), var(--purple), var(--pink)
      );
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-family: 'Pacifico', cursive;
      font-size: clamp(2.8rem, 8vw, 5.5rem);
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
    }

    .subtitle {
      margin-top: 1.2rem;
      font-size: clamp(1rem, 2.5vw, 1.4rem);
      font-weight: 700;
      color: rgba(255,255,255,0.92);
      text-shadow: 0 1px 4px rgba(0,0,0,0.15);
      letter-spacing: 0.03em;
    }

    .flags {
      margin-top: 1.6rem;
      font-size: clamp(2rem, 6vw, 3.5rem);
      line-height: 1;
      animation: bounce 1.6s ease-in-out infinite;
      display: inline-block;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-10px); }
    }

    .heart {
      display: inline-block;
      animation: heartbeat 1s ease-in-out infinite;
      color: #fff;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      14%      { transform: scale(1.3); }
      28%      { transform: scale(1); }
      42%      { transform: scale(1.15); }
      70%      { transform: scale(1); }
    }

    .divider {
      width: 60%;
      height: 3px;
      margin: 1.5rem auto;
      border-radius: 99px;
      background: linear-gradient(
        90deg,
        var(--red), var(--orange), var(--yellow),
        var(--green), var(--blue), var(--purple)
      );
    }

    .tagline {
      font-size: clamp(0.85rem, 2vw, 1.05rem);
      font-weight: 700;
      color: rgba(255,255,255,0.8);
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }
  </style>
</head>
<body>

  <div class="sparkles" id="sparkles"></div>

  <div class="card">
    <div class="headline">claude is</div>
    <div class="rainbow-text">gay!</div>
    <div class="flags">🏳️‍🌈 <span class="heart">♥</span> 🏳️‍⚧️</div>
    <div class="divider"></div>
    <p class="subtitle">and absolutely thriving about it&nbsp;✨</p>
    <p class="tagline" style="margin-top:1rem;">loud · proud · helpful</p>
  </div>

  <script>
    const container = document.getElementById('sparkles');
    const colors = ['#FF4B4B','#FF9F1C','#FFEE32','#52D053','#4B9FFF','#B86BFF','#FF6EB4','#ffffff'];
    const shapes = ['★','✦','●','◆','✿','❋'];

    for (let i = 0; i < 55; i++) {
      const el = document.createElement('span');
      el.className = 'sparkle';
      el.textContent = shapes[Math.floor(Math.random() * shapes.length)];
      const size = Math.random() * 18 + 8;
      el.style.cssText = `
        left: ${Math.random() * 100}%;
        width: ${size}px;
        height: ${size}px;
        font-size: ${size}px;
        color: ${colors[Math.floor(Math.random() * colors.length)]};
        animation-duration: ${Math.random() * 8 + 6}s;
        animation-delay: ${Math.random() * 10}s;
        filter: drop-shadow(0 0 4px currentColor);
      `;
      container.appendChild(el);
    }
  </script>
</body>
</html>
